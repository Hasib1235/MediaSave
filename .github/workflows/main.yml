name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Debug APK (if not already pre-built)
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Pre-built APK found! Skipping slow Gradle build."
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0" || true
            cp -n .env.example .env || touch .env
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            elif [ ! -f debug.keystore ]; then
              keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
            ./gradlew assembleDebug --no-daemon || gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaSave-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
